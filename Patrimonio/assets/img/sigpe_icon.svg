<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1dbf73" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <linearGradient id="iconGearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Fondo redondeado suave -->
  <rect width="512" height="512" rx="112" fill="url(#iconBgGrad)" stroke="#e2e8f0" stroke-width="4"/>

  <!-- Pequeño libro superior -->
  <g fill="url(#iconGreenGrad)" transform="translate(0, 8)">
    <path d="M 250,56 C 224,45 198,47 183,51 C 180,52 178,54 179,57 C 180,59 182,60 185,60 C 198,56 221,55 246,64 Z" />
    <path d="M 262,56 C 288,45 314,47 329,51 C 332,52 334,54 333,57 C 332,59 330,60 327,60 C 314,56 291,55 266,64 Z" />
  </g>

  <!-- Texto SIGPE -->
  <text x="256" y="125" 
        text-anchor="middle" 
        fill="url(#iconGreenGrad)" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="62" 
        font-weight="900" 
        letter-spacing="4">
    SIGPE
  </text>

  <!-- Escudo Base inferior -->
  <path d="M 125,375 C 125,450 195,482 256,500 C 317,482 387,450 387,375" 
        fill="none" 
        stroke="url(#iconGreenGrad)" 
        stroke-width="11" 
        stroke-linecap="round" />

  <!-- Gran libro abierto -->
  <g fill="none" stroke="url(#iconGreenGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 248,390 C 195,364 142,368 120,373 L 120,185 C 147,180 200,176 248,202 Z" />
    <path d="M 264,390 C 317,364 370,368 392,373 L 392,185 C 365,180 312,176 264,202 Z" />
    <path d="M 134,196 C 158,192 204,189 244,211" stroke-width="4.5" />
    <path d="M 378,196 C 354,192 308,189 268,211" stroke-width="4.5" />
  </g>

  <!-- Rayas de página izquierda -->
  <g stroke="url(#iconGreenGrad)" stroke-width="5" stroke-linecap="round">
    <line x1="144" y1="228" x2="178" y2="228" />
    <line x1="144" y1="254" x2="182" y2="254" />
    <line x1="144" y1="332" x2="182" y2="332" />
  </g>

  <!-- Tilde de verificación derecha -->
  <g stroke="url(#iconGreenGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="334" y1="228" x2="368" y2="228" />
    <line x1="331" y1="254" x2="368" y2="254" />
    <path d="M 330,348 L 342,360 L 368,330" stroke-width="7" />
  </g>

  <!-- Engranaje mecánico -->
  <g fill="url(#iconGearGrad)" filter="url(#iconShadow)">
    <path d="
      M 242,192 L 270,192 L 267,208 C 276,211 285,214 293,219 L 306,210 L 326,230 L 317,243 C 322,251 326,260 328,269 L 344,266 L 344,294 L 328,291 C 326,300 322,309 317,317 L 326,330 L 306,350 L 293,341 C 285,346 276,349 267,352 L 270,368 L 242,368 L 245,352 C 236,349 227,346 219,341 L 206,350 L 186,330 L 195,317 C 190,309 186,300 184,291 L 168,294 L 168,266 L 184,269 C 186,260 190,251 195,243 L 186,230 L 206,210 L 219,219 C 227,214 236,211 245,208 Z" />
    <circle cx="256" cy="280" r="47" fill="#ffffff" />
  </g>

  <!-- Llave mecánica en verde -->
  <g fill="url(#iconGreenGrad)">
    <rect x="250" y="298" width="12" height="152" rx="2.5" />
    <path d="
      M 245,234
      C 233,246 230,265 237,281
      C 244,297 260,306 275,303
      C 285,300 293,292 297,283
      L 280,283
      C 278,287 274,291 268,292
      C 260,293 252,288 248,280
      C 244,271 246,262 252,255
      C 256,251 262,249 268,249
      L 268,234
      C 260,232 251,232 245,234 Z" />
  </g>

  <!-- Lomo de cierre inferior -->
  <path d="M 256,396 L 256,448" stroke="url(#iconGreenGrad)" stroke-width="7" stroke-linecap="round" />
</svg>
